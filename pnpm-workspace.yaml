# pnpm 11 的配置位置（package.json 里的 pnpm 字段已不再被读取）
#
# nodeLinker: hoisted
#   pnpm 默认用符号链接/junction 组织 node_modules。在 Windows + Node 24 上，
#   `node_modules/vite` 这类 junction 会让 ESM 的裸模块解析失败
#   （ERR_MODULE_NOT_FOUND: Cannot find package 'rollup'），vite build 直接跑不起来。
#   改成 hoisted（与 npm 相同的扁平结构）即可正常工作，代价是 node_modules 稍大。
#
# ignoredBuiltDependencies: esbuild
#   esbuild 的 postinstall 会 spawn 子进程校验/补装平台二进制。在受限环境下该脚本
#   无法启动子进程并会中断整个 install；平台包里的 esbuild.exe 本身已经可用，
#   所以显式忽略该脚本。
#
# verifyDepsBeforeRun: false
#   pnpm 11 会在执行 package.json 里的 script 之前做一次依赖状态校验；一旦判定不一致，
#   它会自己再跑一次 `pnpm install`，在非交互环境（CI）里会直接以退出码 1 失败：
#     "Command failed ... pnpm install" / confirmModulesPurge
#   这条校验对本地开发没有实际收益，却会让 CI 上的 `pnpm test` / `pnpm build` 挂掉，
#   因此显式关闭。
nodeLinker: hoisted

verifyDepsBeforeRun: false

ignoredBuiltDependencies:
  - esbuild
